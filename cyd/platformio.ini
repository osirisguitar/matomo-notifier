; Cheap Yellow Display clone: Freenove FNK0114B, 2.8" ST7789 240x320, ESP32-WROOM-32E
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; Required so TFT_eSPI uses the -D flags below instead of its bundled User_Setup.h
  -D USER_SETUP_LOADED=1
  ; --- TFT_eSPI config for the Freenove ESP32-S3... 2.8" ST7789 (FNK0114B) ---
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF
  -D USE_HSPI_PORT
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=5000000
  -D SPI_TOUCH_FREQUENCY=2500000
